jornada_superendividamento:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'eesi') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'eesi_local_only') }}"
      schema: "{{ env_var('CLICKHOUSE_DATABASE', 'conciliacao') }}"
      secure: "{{ (env_var('CLICKHOUSE_SECURE', 'false') | lower == 'true') | as_bool }}"
      threads: 1
      custom_settings:
        join_use_nulls: 1
