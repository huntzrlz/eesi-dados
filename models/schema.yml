version: 2
models:
  - name: fct_divida_servidor
    columns:
      - name: divida_id
        tests: [not_null, unique]
      - name: servidor_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_formularios')
              field: servidor_id
      - name: mes_referencia
        tests: [not_null]
      - name: tipo_credor
        tests:
          - accepted_values:
              values: ['banco', 'cartao', 'varejo', 'servico_publico']
  - name: int_servidor_mes
    columns:
      - name: servidor_id
        tests: [not_null, unique]
      - name: faixa_comprometimento
        tests:
          - accepted_values:
              values: ['0-20%', '20-40%', '40-60%', 'acima de 60%']
      - name: capacidade_pagamento
        tests: [not_null]
  - name: resumo_proposta_quitacao
    columns:
      - name: mes_referencia
        tests: [not_null]
      - name: secretaria_municipal
        tests:
          - accepted_values:
              values: ['FINANCAS', 'SAUDE', 'EDUCACAO']
      - name: parcela_mensal_sugerida_total
        tests: [not_null]

